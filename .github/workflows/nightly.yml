# file: .github/workflows/nightly.yml
# version: 2.0.0

name: nightly-live
on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch: {}
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
      # claude CLI install would go here; until then this job is a placeholder
      # that exercises the gated test only when the binary + key are available.
      - run: make test-live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
