# file: .github/workflows/prerelease.yml
# version: 1.0.0

name: Prerelease on Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  prerelease:
    name: Create Prerelease Build
    uses: falkcorp/github-common/.github/workflows/reusable-release.yml@6694e50b2f6564b24cda9b1b78278e9af714c9d9 # latest
    with:
      release-type: 'auto'
      prerelease: true
      draft: false
      go-enabled: true
      frontend-enabled: false
      docker-enabled: false
    secrets: inherit
